<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#0055EE"/>
    </linearGradient>

    <!-- Glass Bubble Fill Gradient -->
    <linearGradient id="bubbleFill" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderStroke" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Icon Soft Drop Shadow -->
    <filter id="appShadow" x="0" y="10" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0033AA" flood-opacity="0.35"/>
    </filter>

    <!-- Inner Glow/Shadow for Depth -->
    <filter id="featherGlow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0044CC" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- APP ICON CONTAINER (iOS/macOS Squircle style) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Subtle Top-Edge Highlight for 3D Depth -->
  <rect width="512" height="512" rx="115" fill="none" stroke="url(#borderStroke)" stroke-width="2" opacity="0.6"/>

  <!-- CHAT BUBBLE (Frosted / Glassmorphism Style) -->
  <g filter="url(#appShadow)">
    <path d="M140 236C140 165.308 191.934 108 256 108C320.066 108 372 165.308 372 236C372 306.692 320.066 364 256 364C234.698 364 214.654 357.653 197.697 346.619L146.463 359.882C140.718 361.371 135.539 356.192 137.028 350.447L150.291 299.213C143.682 279.799 140 258.468 140 236Z" 
          fill="url(#bubbleFill)" 
          stroke="url(#borderStroke)" 
          stroke-width="3"/>
  </g>

  <!-- FLOATING LITE FEATHER / SPEED WING -->
  <g filter="url(#featherGlow)">
    <!-- Main Feather Body -->
    <path d="M208 268C208 268 238 172 316 172C316 172 298 220 262 248C236.425 267.886 218 268 208 268Z" 
          fill="#FFFFFF"/>
    
    <!-- Quill Shaft / Lite Air Trail Cutout -->
    <path d="M208 268C232 272 268 274 290 254" 
          stroke="#0088FF" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          opacity="0.85"/>
  </g>

  <!-- FAST / LITE SPARK DOTS -->
  <circle cx="328" cy="144" r="7" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="348" cy="170" r="4.5" fill="#FFFFFF" opacity="0.75"/>
</svg>
